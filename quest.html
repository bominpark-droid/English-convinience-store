<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#23305B">
<title>단어 퀘스트 - 블록 히어로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#23305B; --navy2:#37477E; --sky:#9BD7FF; --grass:#6BC356;
  --yel:#FFD64D; --yel-dk:#C99B00; --red:#FF5A3C; --red-dk:#D93E22;
  --ink:#26314F; --sub:#6E7791; --line:#D9DEEF; --ok:#22B573;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Jua',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(#BDE3FF,#E8F5FF 60%,#DFF3E4);color:var(--ink);-webkit-font-smoothing:antialiased}
#app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--navy);color:#fff;border-bottom:4px solid #17203F}
.brand{display:flex;align-items:center;gap:7px;font-size:18px}
.powtag{display:flex;align-items:center;gap:5px;background:var(--yel);color:#5A3E00;padding:5px 12px;border-radius:9px;font-size:15px;box-shadow:0 3px 0 var(--yel-dk)}
.gearbtn{background:none;border:none;color:#fff;font-size:19px;padding:6px;cursor:pointer;opacity:.9}

main{flex:1;padding:14px 14px 92px;overflow-x:hidden}
.screen{display:none;animation:fadein .25s ease}
.screen.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.panel{background:#fff;border:3px solid var(--navy);border-radius:14px;padding:16px;box-shadow:4px 4px 0 rgba(35,48,91,.18);margin-bottom:13px}
.sub{color:var(--sub);font-size:14px;line-height:1.5}
h2.sec{font-size:20px;margin:4px 2px 10px;display:flex;align-items:center;gap:8px}

.btnq{display:block;width:100%;border:3px solid var(--navy);cursor:pointer;font-family:inherit;font-size:18px;color:var(--ink);background:var(--yel);border-radius:12px;padding:13px 16px;box-shadow:4px 4px 0 rgba(35,48,91,.35);transition:transform .05s,box-shadow .05s;text-align:center}
.btnq:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(35,48,91,.35)}
.btnq.blue{background:#7FB8F0}
.btnq.green{background:#8FE3A5}
.btnq.ghost{background:#fff}
.btnq.sm{font-size:15px;padding:9px 12px}
.btnq:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px}
.btnrow .btnq{flex:1}
.minib{font-family:inherit;font-size:14px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;color:var(--sub)}
.minib.on{background:var(--navy);border-color:var(--navy);color:#fff}
.knowb{font-family:inherit;font-size:12px;border:none;background:none;color:var(--sub);text-decoration:underline;cursor:pointer;margin-top:10px}
input[type=text]{font-family:inherit;font-size:17px;width:100%;border:3px solid var(--navy);border-radius:12px;padding:12px 14px;outline:none;background:#fff;color:var(--ink)}

/* ── 블록 캐릭터 ── */
.bx{position:relative;width:72px;height:104px}
.bx i{position:absolute;border:2px solid rgba(0,0,0,.28);border-radius:5px}
.bx .h{width:36px;height:30px;left:18px;top:0;background:var(--yel)}
.bx .h:after{content:"";position:absolute;width:5px;height:9px;background:#26314F;left:8px;top:8px;border-radius:2px;box-shadow:14px 0 0 #26314F}
.bx .h:before{content:"";position:absolute;width:12px;height:3px;background:#26314F;left:10px;top:21px;border-radius:2px}
.bx .t{width:46px;height:38px;left:13px;top:31px;background:#2E86DE}
.bx .al{width:13px;height:36px;left:-1px;top:31px;background:var(--yel)}
.bx .ar{width:13px;height:36px;right:-1px;top:31px;background:var(--yel)}
.bx .ll{width:17px;height:34px;left:16px;top:69px;background:#3AA655}
.bx .lr{width:17px;height:34px;left:39px;top:69px;background:#3AA655}
.bx.vill .h{background:#8E93A8}
.bx.vill .h:after{background:var(--red-dk);box-shadow:14px 0 0 var(--red-dk)}
.bx.vill .h:before{width:15px;top:22px;background:#3A0C0C;border-radius:0 0 7px 7px}
.bx.vill .t{background:#3A2E5B}
.bx.vill .al,.bx.vill .ar{background:#8E93A8}
.bx.vill .ll,.bx.vill .lr{background:#26314F}
.bx.idle{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bx.hit{animation:vhit .3s}
@keyframes vhit{30%{transform:translateX(8px) rotate(4deg);filter:brightness(1.7)}}
.bx.down{transition:transform 1.1s ease-in,filter 1.1s;transform:rotate(100deg) translate(10px,26px);filter:grayscale(1) brightness(.75)}
.bx.laugh{animation:vlaugh .5s ease-in-out 3}
@keyframes vlaugh{50%{transform:scale(1.12) rotate(-4deg)}}
.bx.jump{animation:hjump .7s ease-in-out 3}
@keyframes hjump{40%{transform:translateY(-28px)}}
.bx.sad{transform:rotate(-10deg) translateY(6px);filter:saturate(.4)}

/* ── 전투 무대 ── */
.arena{position:relative;height:280px;border:3px solid var(--navy);border-radius:14px;overflow:hidden;background:linear-gradient(#9BD7FF 0 66%,#6BC356 66% 76%,#57A845 76% 100%);margin-bottom:12px}
.a-hero{position:absolute;left:24px;bottom:30px;z-index:3}
.a-vill{position:absolute;right:22px;bottom:30px;z-index:3;transform-origin:bottom}
.a-vname{position:absolute;top:8px;right:10px;width:47%;z-index:4}
.a-vname b{display:block;font-size:12px;color:var(--navy);text-align:right;margin-bottom:3px}
.hpbar{height:15px;border:3px solid var(--navy);border-radius:9px;background:#fff;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(#FF8A6C,#D93E22);width:100%;transition:width .3s}
.a-cloud{position:absolute;font-size:26px;opacity:.9;z-index:1}
.fcard{position:absolute;left:18%;bottom:6px;width:66px;padding:5px 4px;background:#fff;border:3px solid var(--navy);border-radius:8px;font-size:11px;text-align:center;transition:transform .4s ease-in,opacity .35s;z-index:5}
.fcard b{display:block;font-size:12px}
.fcard.crack{background:#E4E6EF;color:#889;border-color:#889}
.vban{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:42px;color:#fff;text-shadow:3px 3px 0 var(--navy);transform:scale(0);z-index:6;letter-spacing:2px}
.vban.on{animation:banin .5s forwards cubic-bezier(.2,1.6,.4,1)}
@keyframes banin{to{transform:scale(1)}}
.bossmsg{text-align:center;font-size:15px;min-height:22px;margin-bottom:10px;color:var(--sub)}
.starfx{position:fixed;top:-16px;z-index:70;font-size:18px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ── 단어 카드 ── */
.wcard{position:relative;background:linear-gradient(160deg,#FFFDF4,#FFF3C4);border:3px solid var(--yel-dk);border-radius:16px;padding:20px 16px;text-align:center;box-shadow:4px 4px 0 rgba(35,48,91,.18);min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.wcard .w{font-size:36px;word-break:break-word;line-height:1.1}
.wcard .k{font-size:23px;color:#7A5600}
.wcard .ex{font-size:16px;line-height:1.5;margin-top:6px}
.wcard .ext{font-size:13px;color:var(--sub);line-height:1.5}
.atk{position:absolute;top:9px;right:9px;background:var(--navy);color:var(--yel);border-radius:8px;padding:2px 9px;font-size:13px}
.lvtag{position:absolute;top:9px;left:9px;background:var(--yel);color:#5A3E00;border-radius:8px;padding:2px 9px;font-size:12px;box-shadow:0 2px 0 var(--yel-dk)}
.spkb{border:3px solid var(--navy);background:#fff;color:var(--navy);font-family:inherit;font-size:14px;border-radius:999px;padding:8px 15px;cursor:pointer;box-shadow:0 3px 0 rgba(35,48,91,.3);display:inline-flex;align-items:center;gap:5px;margin-top:8px}
.spkb:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,48,91,.3)}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#C9D0E6}
.dots i.done{background:var(--ok)}
.dots i.now{background:var(--yel-dk);transform:scale(1.25)}
.learnhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lvb{display:inline-flex;align-items:center;gap:6px;background:#E5ECFF;color:var(--navy);border-radius:999px;padding:5px 12px;font-size:13px}

/* ── 퀴즈 ── */
.qbox{text-align:center;padding:22px 16px}
.qbox .qword{font-size:34px;margin:6px 0;word-break:break-word}
.qbox .qmean{font-size:24px;color:#7A5600;margin:6px 0}
.qbox .qtype{font-size:13px;color:var(--sub)}
.opts{display:flex;flex-direction:column;gap:10px}
.qopt{font-family:inherit;font-size:18px;text-align:left;cursor:pointer;background:#fff;border:3px solid var(--navy);border-radius:12px;padding:13px 15px;box-shadow:4px 4px 0 rgba(35,48,91,.25);color:var(--ink);transition:transform .05s}
.qopt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(35,48,91,.25)}
.qopt.ok{background:#DFF8E8;border-color:var(--ok);color:#0A6B4C}
.qopt.bad{background:#FFE9E3;border-color:var(--red);color:#B23317;animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.qfeed{min-height:28px;text-align:center;font-size:17px;margin-top:12px}
.qfeed .good{color:var(--ok)} .qfeed .oops{color:var(--red)}

/* ── 맵 ── */
.worldhead{position:relative;border:3px solid var(--navy);border-radius:14px;overflow:hidden;margin-bottom:13px;background:linear-gradient(#8FD0FF,#D6EEFF);padding:14px 16px;box-shadow:4px 4px 0 rgba(35,48,91,.18)}
.worldhead h3{font-size:20px;color:var(--navy)}
.worldhead .sub{font-size:13px}
.wvill{position:absolute;right:12px;top:10px;font-size:40px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.spath{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
.snode{width:42px;height:42px;border:3px solid var(--navy);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 42px}
.snode.done{background:#CFF3D8}
.snode.cur{background:var(--yel);animation:bob 1.4s infinite}
.snode.lock{background:#E7E9F2;color:#9AA0B4}
.sdash{flex:0 0 8px;height:4px;background:var(--navy);border-radius:2px;opacity:.3}
.statrow{display:flex;gap:10px;margin-bottom:13px}
.statbox{flex:1;background:#fff;border:3px solid var(--navy);border-radius:12px;padding:11px 6px;text-align:center;box-shadow:3px 3px 0 rgba(35,48,91,.15)}
.statbox b{display:block;font-size:18px;color:var(--navy)}
.statbox span{font-size:11.5px;color:var(--sub)}

/* ── 도감 ── */
.deckgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.dcard{position:relative;background:linear-gradient(160deg,#FFFDF4,#FFF3C4);border:2px solid var(--yel-dk);border-radius:10px;padding:20px 5px 8px;text-align:center;font-size:13px;min-height:78px}
.dcard b{display:block;font-size:14px;word-break:break-word}
.dcard small{display:block;font-size:11px;color:#7A5600;margin-top:2px}
.dcard .datk{position:absolute;top:3px;right:4px;font-size:10px;background:var(--navy);color:var(--yel);border-radius:6px;padding:1px 5px}
.dcard.crack{filter:grayscale(.75);background:#EDEDF2}
.dcard.crack:before{content:"💔";position:absolute;top:2px;left:4px;font-size:12px}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;display:flex;background:#fff;border-top:3px solid var(--navy);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;font-family:inherit;cursor:pointer;padding:9px 0 8px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ni{font-size:21px;line-height:1}
nav button.on{color:var(--navy)}
nav button.on .ni{transform:scale(1.12)}

.modalbg{position:fixed;inset:0;background:rgba(20,26,50,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}
.modalbg.on{display:flex}
.modal{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:440px;padding:22px 18px 28px;max-height:86dvh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:19px;margin-bottom:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.center{text-align:center}
.bigemo{font-size:60px;margin:8px 0}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">🧱 단어 퀘스트</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="powtag">⚡ <b id="powVal">0</b></div>
      <button class="gearbtn" id="gearBtn" aria-label="설정">⚙️</button>
    </div>
  </div>
  <main>
    <div class="screen" id="scr-title"></div>
    <div class="screen" id="scr-map"></div>
    <div class="screen" id="scr-learn"></div>
    <div class="screen" id="scr-quiz"></div>
    <div class="screen" id="scr-boss"></div>
    <div class="screen" id="scr-deck"></div>
  </main>
  <nav id="nav">
    <button data-go="map" class="on"><span class="ni">🗺️</span>모험 맵</button>
    <button data-go="deck"><span class="ni">🃏</span>카드 도감</button>
  </nav>
  <div class="modalbg" id="modalBg"><div class="modal" id="modalBox"></div></div>
</div>
<script>
/* ═══════════ 서버 (영어 편의점과 같은 서버·같은 계정) ═══════════ */
const SERVER_URL = "https://script.google.com/macros/s/AKfycbzKVP3wfZWfKvYEEKjRNhW5yRLkXX_gGG6MCSy-fVfosxuROAoPSqAT_2M087AMV3mp/exec";
let SESSION = null;
try{ SESSION = JSON.parse(localStorage.getItem("ecvs-session")||"null"); }catch(e){}
async function api(action, data){
  if(!SERVER_URL) throw new Error("no-server");
  const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const tid = ctl ? setTimeout(()=>ctl.abort(), 15000) : null;
  try{
    const r = await fetch(SERVER_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({action}, data||{})), redirect:"follow", signal: ctl ? ctl.signal : undefined});
    if(!r.ok) throw new Error("http-"+r.status);
    const j = await r.json();
    if(j && j.ok) return j;
    throw new Error(j && j.err ? j.err : "server");
  } finally { if(tid) clearTimeout(tid); }
}

/* ═══════════ 단어 DB (영어 편의점과 동일 — 두 파일을 항상 같이 고칠 것) ═══════════ */

function comma(n){ return (n||0).toLocaleString("ko-KR"); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ═══════════ 효과음 + 팡파레 ═══════════ */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f, t0, dur, type, vol){
  const c = ac(); if(!c || (QS && QS.snd===false)) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001, c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol||0.12, c.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.05);
}
const Sfx = {
  ok(){ tone(660,0,.12,"triangle"); tone(880,.1,.16,"triangle"); },
  bad(){ tone(200,0,.22,"sawtooth",.07); },
  hit(){ tone(300,0,.08,"square",.08); tone(180,.06,.12,"sawtooth",.06); },
  flip(){ tone(500,0,.06,"sine",.05); },
  tada(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.18,"triangle")); }
};

/* ═══════════ 발음 ═══════════ */
let voices=[];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  const rank = v=>{
    const n=(v.name||"").toLowerCase(), l=(v.lang||"").replace("_","-").toLowerCase();
    if(!l.startsWith("en")) return -1;
    let s = l.startsWith("en-us") ? 4 : 1;
    if(/premium/.test(n)) s+=6;
    if(/enhanced|neural|natural|online|multilingual/.test(n)) s+=5;
    if(/google us english/.test(n)) s+=4;
    if(/compact|espeak|novelty|eloquence|grandma|grandpa|whisper|zarvox|trinoids|bells|boing/.test(n)) s-=8;
    return s;
  };
  let best=null, bs=-99;
  voices.forEach(v=>{ const s=rank(v); if(s>bs){ bs=s; best=v; } });
  return bs>0 ? best : null;
}
let CURA=null;
const TTSC = new Map();
function stopAudio(){ try{ if(CURA){ CURA.pause(); CURA=null; } }catch(e){} try{ speechSynthesis.cancel(); }catch(e){} }
function mkUtter(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang="en-US"; const v=pickVoice(); if(v) u.voice=v;
  u.rate = (QS && QS.rate) || 0.85; u.pitch=1.0;
  return u;
}
let ttsT=null, ttsRetryT=null;
function speakLocal(text){
  if(!("speechSynthesis" in window)) return;
  clearTimeout(ttsT); clearTimeout(ttsRetryT);
  try{ stopAudio(); }catch(e){}
  if(!voices.length) loadVoices();
  ttsT = setTimeout(function(){
    try{ speechSynthesis.resume(); }catch(e){}
    try{ speechSynthesis.speak(mkUtter(text)); }catch(e){}
    ttsRetryT = setTimeout(function(){
      try{
        if(!speechSynthesis.speaking && !speechSynthesis.pending){
          speechSynthesis.resume();
          speechSynthesis.speak(mkUtter(text));
        }
      }catch(e){}
    }, 320);
  }, 60);
}
async function speak(text){
  if(SESSION && SESSION.tts){
    try{
      let b64 = TTSC.get(text);
      if(!b64){
        const j = await api("tts", {uid:SESSION.uid, token:SESSION.token, text});
        b64 = j.audio; if(!b64) throw new Error("noaudio");
        TTSC.set(text, b64);
        if(TTSC.size>200) TTSC.delete(TTSC.keys().next().value);
      }
      stopAudio();
      const a = new Audio("data:audio/mp3;base64,"+b64);
      a.playbackRate = ((QS && QS.rate) || 0.85) + 0.15;
      a.onerror = function(){ speakLocal(text); };
      CURA=a;
      const pr = a.play();
      if(pr && pr.catch) pr.catch(function(){ speakLocal(text); });   /* 재생 막히면 기기 음성으로 */
      return;
    }catch(e){}
  }
  speakLocal(text);
}

let STAGES = [];
function buildStages(){
  STAGES = [];
  for(let lv=0; lv<=5; lv++){
    const arr = WORDS[lv];
    for(let i=0; i<arr.length; i+=10){
      STAGES.push({lv, no:STAGES.length, inw:Math.floor(i/10), words:arr.slice(i, i+10)});
    }
  }
}
function stagesInWorld(lv){ return STAGES.filter(s=>s.lv===lv).length; }
function needFull(st){ return st.words.length>=10 ? 8 : Math.ceil(st.words.length*0.8); }
function cardATK(w, lv){ return Math.max(lv,1)*10 + w.length; }

function startStage(){
  ac(); stopAudio();
  if(clearedToday()){ goMap(); return; }
  const si = curStageIdx();
  if(si >= STAGES.length){ goMap(); return; }
  const st = STAGES[si];
  B = { si, list: st.words.map(a=>({w:a[0],k:a[1],e:a[2],t:a[3],lv:st.lv,full:null})), i:0, retry:false };
  const w = WORLDS[st.lv];
  if(!QS.seenIntro[st.lv]){
    QS.seenIntro[st.lv] = 1; save();
    openModal('<div class="center"><div class="bigemo">'+w.vemo+'</div>'
     +'<h3 style="text-align:center">'+w.emo+' '+w.nm+'에 도착!</h3>'
     +'<p class="sub" style="margin:10px 0 16px">'+w.intro+'</p>'
     +'<button class="btnq" onclick="closeModal();renderLearn();show(\'learn\')">가 보자! 🧱</button></div>');
    return;
  }
  renderLearn(); show("learn");
}

   '<div class="learnhead"><button class="minib" onclick="askQuit()">← 나가기</button><div class="dots">'+dots+'</div></div>'

/* ═══════════ 전투 퀴즈 (카드 되찾기) ═══════════ */
let QZ = null;
function startBattle(){
  const targets = B.list.filter(c=>c.full!==true);
  if(!targets.length){ renderBoss(); show("boss"); return; }
  QZ = { queue: shuffle(targets), i:0, lock:false };
  renderBQ(); show("quiz");
}
function makeOpts(item, type){
  const pool = WORDS[item.lv].filter(a=>a[0]!==item.w);
  const dist = shuffle(pool).slice(0,3);
  if(type==="ke"){
    const opts = shuffle([item.w].concat(dist.map(a=>a[0])));
    return {opts, correct:opts.indexOf(item.w)};
  }
  const opts = shuffle([item.k].concat(dist.map(a=>a[1])));
  return {opts, correct:opts.indexOf(item.k)};
}
function renderBQ(){
  const item = QZ.queue[QZ.i];
  const type = ["ek","ke","listen"][Math.floor(Math.random()*3)];
  const {opts, correct} = makeOpts(item, type);
  QZ.cur = {item, type, opts, correct};
  QZ.lock = false;
  const st = STAGES[B.si], w = WORLDS[st.lv];
  const fullN = B.list.filter(c=>c.full===true).length;
  let head, body;
  if(type==="ek"){ head="이 단어의 뜻은?"; body='<div class="qword">'+esc(item.w)+'</div><button class="spkb" onclick="speak(QZ.cur.item.w)">🔊 듣기</button>'; }
  else if(type==="ke"){ head="영어로 뭘까?"; body='<div class="qmean">'+esc(item.k)+'</div>'; }
  else { head="잘 듣고 뜻을 골라 봐!"; body='<div class="qword" id="qHid">🎧</div><button class="spkb" onclick="speak(QZ.cur.item.w)">🔊 다시 듣기</button>'; }
  let html = '<div class="learnhead"><button class="minib" onclick="askQuit()">← 나가기</button>'
   +'<span class="lvb">'+w.vemo+' 카드 되찾기 '+(QZ.i+1)+'/'+QZ.queue.length+' · ⭐'+fullN+'</span></div>'
   +'<div class="panel qbox"><div class="qtype">'+head+'</div>'+body+'</div><div class="opts">';
  opts.forEach((o,idx)=>{ html += '<button class="qopt" id="bopt'+idx+'" onclick="battleAnswer('+idx+')">'+esc(o)+'</button>'; });
  html += '</div><div class="qfeed" id="bFeed"></div>';
  $("#scr-quiz").innerHTML = html;
  if(type==="listen") speak(item.w);
}
function battleAnswer(idx){
  if(QZ.lock) return; QZ.lock = true;
  const {item, type, opts, correct} = QZ.cur;
  const right = (idx===correct);
  if(type==="listen"){ const h=$("#qHid"); if(h) h.textContent = item.w; }
  const cb = $("#bopt"+correct);
  const expl = '<div class="panel" style="margin-top:10px;padding:12px 14px;text-align:left">'
   +'<b style="font-size:17px">'+esc(item.w)+'</b> <span class="sub" style="font-size:13px">'+esc(item.k)+'</span>'
   +'<div style="font-size:14px;margin-top:6px">'+esc(item.e)+'</div>'
   +'<div class="sub" style="font-size:12.5px">'+esc(item.t)+'</div>'
   +'<button class="spkb" style="margin-top:8px" onclick="speak(QZ.cur.item.e)">🔊 예문 듣기</button></div>'
   +'<button class="btnq" style="margin-top:12px" onclick="battleNext()">다음 ▶</button>';
  if(right){
    item.full = true;
    const b=$("#bopt"+idx); if(b) b.classList.add("ok");
    Sfx.ok(); if(type==="ke") speak(item.w);
    $("#bFeed").innerHTML = '<span class="good">⭐ 온전한 카드 획득! (+⚡'+cardATK(item.w,item.lv)+')</span>' + expl;
  } else {
    item.full = false;
    const b=$("#bopt"+idx); if(b) b.classList.add("bad");
    if(cb) cb.classList.add("ok");
    Sfx.bad();
    $("#bFeed").innerHTML = '<span class="oops">💔 금 간 카드... 정답은 <b>'+esc(opts[correct])+'</b></span>' + expl;
  }
}
function battleNext(){
  QZ.i++;
  if(QZ.i < QZ.queue.length){ renderBQ(); return; }
  renderBoss(); show("boss");
}

/* ═══════════ 보스전 (승리 애니메이션 약 10초) ═══════════ */
function renderBoss(){
  stopAudio();
  const st = STAGES[B.si], w = WORLDS[st.lv];
  const need = needFull(st);
  const fullN = B.list.filter(c=>c.full===true).length;
  const win = fullN >= need;
  $("#scr-boss").innerHTML =
   '<div class="learnhead"><span class="lvb">'+w.emo+' 스테이지 '+(st.inw+1)+' 보스전</span>'
   +'<span class="lvb">⭐ '+fullN+' / '+need+'장 필요</span></div>'
   +'<div class="arena" id="arena">'
   +'<div class="a-cloud" style="left:8%;top:9%">☁️</div><div class="a-cloud" style="right:14%;top:20%">☁️</div>'
   +'<div class="a-vname"><b>'+w.vemo+' '+w.vil+'</b><div class="hpbar"><i id="bossHp"></i></div></div>'
   +'<div class="a-hero"><div class="bx idle" id="heroBx"><i class="h"></i><i class="t"></i><i class="al"></i><i class="ar"></i><i class="ll"></i><i class="lr"></i></div></div>'
   +'<div class="a-vill"><div class="bx vill idle" id="villBx"><i class="h"></i><i class="t"></i><i class="al"></i><i class="ar"></i><i class="ll"></i><i class="lr"></i></div></div>'
   +'<div class="vban" id="vBan"></div></div>'
   +'<div class="bossmsg" id="bMsg">카드의 힘으로 공격 개시!</div>'
   +'<div id="bPanel"></div>';
  const arena = $("#arena"), villBx = $("#villBx"), heroBx = $("#heroBx"), hp = $("#bossHp"), msg = $("#bMsg");
  const fulls = B.list.filter(c=>c.full===true);
  let hpLeft = 100;
  const per = fulls.length ? Math.floor(100/Math.max(need,fulls.length)) : 0;
  B.list.forEach((c,i)=>{
    setTimeout(()=>{
      if(!arena || !arena.isConnected) return;
      const f = document.createElement("div");
      f.className = "fcard" + (c.full ? "" : " crack");
      f.innerHTML = '<b>'+esc(c.w)+'</b>'+(c.full ? "⭐" : "💔");
      arena.appendChild(f);
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
        if(c.full){
          f.style.transform = "translate("+(arena.clientWidth*0.52)+"px,-165px) rotate(18deg)";
          setTimeout(()=>{
            Sfx.hit();
            if(villBx){ villBx.classList.remove("hit"); void villBx.offsetWidth; villBx.classList.add("hit"); }
            hpLeft = Math.max(0, hpLeft - per);
            if(hp) hp.style.width = hpLeft + "%";
            f.style.opacity = "0";
          }, 400);
        } else {
          f.style.transform = "translate("+(arena.clientWidth*0.3)+"px,-60px) rotate(80deg)";
          setTimeout(()=>{ f.style.transform = "translate("+(arena.clientWidth*0.3)+"px,40px) rotate(140deg)"; f.style.opacity="0"; tone(150,0,.15,"sawtooth",.05); }, 380);
        }
        setTimeout(()=>f.remove(), 1100);
      }); });
    }, 500 + i*430);
  });
  const tEnd = 500 + B.list.length*430 + 500;
  if(win){
    setTimeout(()=>{ if(hp) hp.style.width = "0%"; }, tEnd-300);
    setTimeout(()=>{
      if(villBx){ villBx.classList.remove("idle"); villBx.classList.add("down"); }
      if(msg) msg.textContent = w.vil+"이(가) 쓰러졌다!";
      tone(120,0,.5,"sawtooth",.08);
    }, tEnd);
    setTimeout(()=>{
      const bn=$("#vBan"); if(bn){ bn.textContent="VICTORY!"; bn.classList.add("on"); }
      if(heroBx){ heroBx.classList.remove("idle"); heroBx.classList.add("jump"); }
      fanfare(); stars();
      if(msg) msg.textContent = "단어를 모두 되찾았다! 🎉";
    }, tEnd+900);
    setTimeout(()=>{ finishStage(fullN, need); }, tEnd+3600);
  } else {
    setTimeout(()=>{
      if(villBx){ villBx.classList.remove("idle"); villBx.classList.add("laugh"); }
      if(heroBx){ heroBx.classList.remove("idle"); heroBx.classList.add("sad"); }
      const bn=$("#vBan"); if(bn){ bn.textContent="아까워..!"; bn.classList.add("on"); }
      Sfx.bad();
      if(msg) msg.textContent = "온전한 카드가 "+(need-fullN)+"장 모자라!";
    }, tEnd);
    setTimeout(()=>{
      $("#bPanel").innerHTML =
       '<div class="panel center"><p class="sub" style="margin-bottom:12px">⭐ 온전한 카드 <b>'+fullN+'장</b> / 필요 <b>'+need+'장</b><br>금 간 카드 '+(B.list.length-fullN)+'장을 다시 외우면 이길 수 있어!</p>'
       +'<button class="btnq" onclick="retryStage()">🔥 다시 도전 (틀린 단어만)</button>'
       +'<button class="knowb" onclick="goMap()">잠깐 쉬었다 할래</button></div>';
    }, tEnd+1300);
  }
}
function retryStage(){
  B.retry = true;
  B.list.forEach(c=>{ if(c.full!==true) c.full=null; });
  B.i = B.list.findIndex(c=>c.full===null);
  if(B.i<0) B.i = 0;
  const first = B.list.filter(c=>c.full===null);
  B.list = B.list.filter(c=>c.full===true).concat(first);
  B.i = B.list.findIndex(c=>c.full===null);
  renderLearnRetry();
}
function renderLearnRetry(){
  const targets = B.list.filter(c=>c.full===null);
  if(!targets.length){ startBattle(); return; }
  RB = { list: targets, i: 0 };
  renderRetryCard(); show("learn");
}
let RB = null;
function renderRetryCard(){
  const n = RB.list.length;
  if(RB.i >= n){ startBattle(); return; }
  const c = RB.list[RB.i];
  let dots="";
  for(let i=0;i<n;i++){ dots += '<i class="'+(i<RB.i?"done":(i===RB.i?"now":""))+'"></i>'; }
  $("#scr-learn").innerHTML =
   '<div class="learnhead"><button class="minib" onclick="askQuit()">← 나가기</button><div class="dots">'+dots+'</div></div>'
   +'<div class="wcard"><span class="lvtag">🔁 다시 외우기 '+(RB.i+1)+' / '+n+'</span><span class="atk">⚡ '+cardATK(c.w,c.lv)+'</span>'
   +'<div class="w">'+esc(c.w)+'</div>'
   +'<div class="k">'+esc(c.k)+'</div>'
   +'<div class="ex">'+esc(c.e)+'</div>'
   +'<div class="ext">'+esc(c.t)+'</div>'
   +'<div><button class="spkb" onclick="speak(RB.list[RB.i].w)">🔊 단어</button> <button class="spkb" onclick="speak(RB.list[RB.i].e)">🔊 문장</button></div></div>'
   +'<p class="sub center" style="margin:10px 0;font-size:13px">이번엔 꼭 되찾자! 💪</p>'
   +'<div class="btnrow">'
   +'<button class="btnq ghost" style="flex:0 0 30%" onclick="retryPrev()" '+(RB.i===0?"disabled":"")+'>◀</button>'
   +(RB.i===n-1 ? '<button class="btnq" onclick="startBattle()">⚔️ 재도전!</button>'
                : '<button class="btnq blue" onclick="retryNext()">다음 ▶</button>')
   +'</div>';
  speak(c.w);
}
function retryNext(){ if(RB.i < RB.list.length-1){ RB.i++; renderRetryCard(); } }
function retryPrev(){ if(RB.i > 0){ RB.i--; renderRetryCard(); } }

/* ═══════════ 스테이지 클리어 ═══════════ */
function finishStage(fullN, need){
  const st = STAGES[B.si];
  const t = todayStr();
  B.list.forEach(c=>{
    const prev = QS.cards[c.w];
    const full = c.full===true || (prev && prev.full);
    QS.cards[c.w] = { lv:c.lv, atk:cardATK(c.w,c.lv), full:full, dt:t };
  });
  QS.prog++; QS.lastClear = t;
  save(); updPow();
  let got = "";
  B.list.forEach(c=>{
    got += '<div class="dcard'+(QS.cards[c.w].full?"":" crack")+'"><span class="datk">⚡'+cardATK(c.w,c.lv)+'</span><b>'+esc(c.w)+'</b><small>'+esc(c.k)+'</small></div>';
  });
  $("#bPanel").innerHTML =
   '<div class="panel center"><h3 style="font-size:20px;margin-bottom:4px">🎉 스테이지 클리어!</h3>'
   +'<p class="sub" style="margin-bottom:10px">⭐ 온전한 카드 '+fullN+'장 획득 · 총 파워 ⚡'+comma(totalPower())+'<br>내일 새 스테이지가 열려!</p>'
   +'<div class="deckgrid" style="margin-bottom:12px">'+got+'</div>'
   +'<button class="btnq" onclick="goMap()">맵으로 🗺️</button></div>';
}

/* ═══════════ 카드 도감 ═══════════ */
function renderDeck(){
  updPow();
  const total = Object.keys(QS.cards).length;
  let html = '<h2 class="sec">🃏 카드 도감 <span class="lvb">'+total+'장 / 375장</span></h2>'
   +'<div class="statrow">'
   +'<div class="statbox"><b>'+comma(fullCards())+'</b><span>⭐ 온전한 카드</span></div>'
   +'<div class="statbox"><b>'+comma(total-fullCards())+'</b><span>💔 금 간 카드</span></div>'
   +'<div class="statbox"><b>'+comma(totalPower())+'</b><span>⚡ 총 파워</span></div></div>';
  for(let lv=1; lv<=5; lv++){
    const w = WORLDS[lv];
    const owned = WORDS[lv].filter(a=>QS.cards[a[0]]);
    if(!owned.length) continue;
    let cards = "";
    owned.forEach(a=>{
      const c = QS.cards[a[0]];
      cards += '<div class="dcard'+(c.full?"":" crack")+'" onclick="speak(\''+a[0]+'\')"><span class="datk">⚡'+c.atk+'</span><b>'+esc(a[0])+'</b><small>'+esc(a[1])+'</small></div>';
    });
    html += '<div class="panel"><div style="font-size:15px;margin-bottom:8px">'+w.emo+' 월드'+lv+' · '+w.nm+' <span class="sub" style="font-size:12px">'+owned.length+'/'+WORDS[lv].length+'</span></div>'
     +'<div class="deckgrid">'+cards+'</div></div>';
  }
  if(!total){
    html += '<div class="panel center"><div class="bigemo">🃏</div><p class="sub">아직 모은 카드가 없어!<br>오늘의 스테이지를 깨고 첫 카드를 되찾자.</p></div>';
  } else {
    html += '<p class="sub" style="font-size:12px;text-align:center;margin-top:4px">카드를 누르면 발음이 나와요 🔊</p>';
  }
  $("#scr-deck").innerHTML = html;
}

/* ═══════════ 설정 ═══════════ */
function openQSettings(){
  openModal('<h3>⚙️ 설정</h3>'
   +'<div class="setrow"><span>효과음·팡파레</span><button class="minib '+(QS.snd?"on":"")+'" onclick="qtoggleSnd()">'+(QS.snd?"켜짐":"꺼짐")+'</button></div>'
   +'<div class="setrow"><span>발음 속도</span><div style="display:flex;gap:6px">'
   +'<button class="minib '+(QS.rate===0.7?"on":"")+'" onclick="qsetRate(0.7)">느리게</button>'
   +'<button class="minib '+(QS.rate===0.85?"on":"")+'" onclick="qsetRate(0.85)">보통</button>'
   +'<button class="minib '+(QS.rate===1.0?"on":"")+'" onclick="qsetRate(1.0)">빠르게</button></div></div>'
   +'<div class="setrow"><span>저장</span><span class="sub" style="font-size:12px">'+(SESSION ? "☁️ "+esc(SESSION.uid)+" 계정에 자동 저장" : "이 기기에 저장")+'</span></div>'
   +'<div class="setrow"><span>영어 편의점 가기</span><button class="minib" onclick="location.href=\'index.html\'">이동 🏪</button></div>'
   +'<div style="margin-top:16px"><button class="btnq sm" style="background:#FFB3A0" onclick="qaskReset()">모험 처음부터 다시</button></div>');
}
function qtoggleSnd(){ QS.snd = !QS.snd; save(); openQSettings(); }
function qsetRate(r){ QS.rate = r; save(); openQSettings(); speak("Hello! Let's go on an adventure!"); }
function qaskReset(){
  openModal('<div class="center"><div class="bigemo">🗑️</div><h3 style="text-align:center">정말 처음부터?</h3>'
   +'<p class="sub" style="margin:8px 0 16px">모은 카드와 진행이 모두 사라져. 되돌릴 수 없어!</p>'
   +'<div class="btnrow"><button class="btnq" style="background:#FFB3A0" onclick="qdoReset()">응, 처음부터</button>'
   +'<button class="btnq ghost" onclick="closeModal()">취소</button></div></div>');
}
function qdoReset(){ QS = defQS(); save(); updPow(); closeModal(); renderTitle(); show("title"); }
$("#gearBtn").addEventListener("click", openQSettings);

/* ═══════════ 소리 깨우기 (아이폰은 한 번 누르기 전엔 소리를 막는다) ═══════════ */
let audioReady = false;
function unlockAudio(){
  if(audioReady) return; audioReady = true;
  try{ const c = ac(); if(c && c.state === "suspended") c.resume(); }catch(e){}
  try{ loadVoices(); const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
}
document.addEventListener("touchend", unlockAudio, {passive:true});
document.addEventListener("click", unlockAudio);

/* ═══════════ 부팅 ═══════════ */
async function boot(){
  let local = null;
  try{ local = JSON.parse(localStorage.getItem("ecvs-quest")||"null"); }catch(e){}
  QS = Object.assign(defQS(), local||{});
  buildStages();
  if(SESSION){
    try{
      const j = await api("qload", {uid:SESSION.uid, token:SESSION.token});
      const sv = j.state;
      if(sv && typeof sv.prog==="number" && sv.startStage>=0 && (sv.prog >= (QS.prog||0) || QS.startStage<0)){
        QS = Object.assign(defQS(), sv);
      }
    }catch(e){}
  }
  /* 월드0(왕초보)이 앞에 생기면서 스테이지 번호가 밀린다 —
     이미 하던 사람의 진행이 왕초보로 되돌아가지 않게 한 번만 옮겨 준다. */
  if((QS.v||1) < 2){
    if(QS.startStage >= 0) QS.startStage += stagesInWorld(0);
    QS.v = 2; save();
  }
  updPow();
  if(QS.startStage < 0){ renderTitle(); show("title"); }
  else { renderMap(); show("map"); }
}
boot();
</script>
